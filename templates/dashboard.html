<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

    <h2>Welcome {{ username }}</h2>

    <form method="POST">
        <input type="text" name="task" placeholder="Enter Task" required>
        <button type="submit">Add Task</button>
    </form>

    <h3>Your Tasks</h3>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task[2] }}
                <a href="/delete/{{ task[0] }}">Delete</a>
            </li>
        {% endfor %}
    </ul>

    <br>

    <a href="/logout">Logout</a>

</body>
</html>
