<!DOCTYPE html>
<html>
<head>
    <title>Task Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            font-family: 'Poppins', sans-serif;
        }

        .container-box {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .task-item:hover {
            background: #f1f3f5;
        }

        .delete-btn {
            color: #ff4d4f;
            text-decoration: none;
            font-weight: 500;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        .add-btn {
            width: 100%;
            border-radius: 8px;
        }

        .form-control {
            border-radius: 8px;
        }

        .list-group-item {
            border: none;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container-box">

    <h2>👋 Welcome {{ username }}</h2>
<div class="d-flex justify-content-end">
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</div>

    <!-- Add Task -->
    <form method="POST">
        <input type="text" name="task" class="form-control mb-2" placeholder="Enter your task..." required>
        <button type="submit" class="btn btn-primary add-btn">Add Task</button>
    </form>

    <hr>

    <!-- Task List -->
    <ul class="list-group mt-3">
        {% for task in tasks %}
            <li class="list-group-item task-item">
                <span>📌 {{ task[1] }}</span>
                <a class="delete-btn" href="/delete/{{ task[0] }}">Delete</a>
            </li>
        {% endfor %}
    </ul>

</div>

</body>
</html>
